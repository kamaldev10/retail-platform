<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="pumpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card / Maskable Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Fuel Pump Body -->
  <g filter="url(#shadow)" transform="translate(116, 96)">
    <!-- Base & Body -->
    <rect x="30" y="40" width="180" height="260" rx="20" fill="url(#pumpGrad)"/>
    
    <!-- Top Indicator Lamp / Branding -->
    <rect x="55" y="60" width="130" height="45" rx="10" fill="#0f172a" />
    <text x="120" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f97316" text-anchor="middle">GASOLINE</text>

    <!-- Digital Screen -->
    <rect x="55" y="120" width="130" height="60" rx="8" fill="#1e293b"/>
    <text x="168" y="146" font-family="monospace" font-size="16" font-weight="bold" fill="#34d399" text-anchor="end">Rp 10.000</text>
    <text x="168" y="166" font-family="monospace" font-size="13" fill="#fbbf24" text-anchor="end">1.00 L</text>

    <!-- Nozzle / Hose Side -->
    <path d="M 210 120 C 250 120, 260 220, 230 250 C 215 265, 210 240, 210 220" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Nozzle Handle -->
    <path d="M 230 215 L 245 195 L 235 180" fill="none" stroke="#ea580c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pump Base Stand -->
    <rect x="15" y="300" width="210" height="24" rx="6" fill="#0f172a"/>
  </g>
</svg>
